<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🛁🐾💦</title>
  <link rel="icon" type="image/jpeg" href="icons/dogday.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="kid-shell">
    <!-- Top Bar: 8 Big Critter Avatar Buttons (Zero Text) -->
    <header class="kid-topbar">
      <nav id="levelNavBar" class="critter-nav" aria-label="Critters"></nav>
    </header>

    <!-- Main Stage: Big Toy Buttons on Left + Huge Play Canvas + Visual Duck/Tub Bar -->
    <main class="kid-stage">
      <!-- Big Toy Icon Buttons (Zero Text) -->
      <aside class="toy-dock">
        <button id="toolDig" class="toy-btn active" data-tool="dig" aria-label="Dig">⛏️</button>
        <button id="toolFill" class="toy-btn" data-tool="fill" aria-label="Fill">🧱</button>
        <button id="toolPurify" class="toy-btn" data-tool="purify" aria-label="Magic">✨</button>
        <div class="dock-divider"></div>
        <button id="btnAddWater" class="toy-btn boost-water" aria-label="More Water">🌧️</button>
        <button id="btnAutoHint" class="toy-btn boost-hint" aria-label="Magic Path">💡</button>
        <button id="btnResetLevel" class="toy-btn boost-reset" aria-label="Replay">🔄</button>
        <button id="btnSoundToggle" class="toy-btn boost-sound" aria-label="Sound">🔊</button>
      </aside>

      <!-- Giant Interactive Physics Canvas -->
      <section class="canvas-wrap">
        <!-- Top Visual HUD Inside Stage: Current Critter + 3 Rubber Ducks + Water Meter -->
        <div class="visual-hud">
          <div class="hud-critter-badge">
            <img id="sideCritterImg" src="icons/dogday.jpg" alt="" />
            <span id="critterMoodBadge" class="hud-mood">🧼</span>
          </div>

          <div class="hud-ducks" id="duckSlotsRow">
            <div class="hud-duck" id="duckSlot0">🐤</div>
            <div class="hud-duck" id="duckSlot1">🐤</div>
            <div class="hud-duck" id="duckSlot2">🐤</div>
          </div>

          <div class="hud-meter">
            <span class="meter-icon">🚿</span>
            <div class="meter-track">
              <div id="bathProgressBar" class="meter-fill"></div>
            </div>
            <span class="meter-icon">🛁</span>
          </div>
        </div>

        <div class="canvas-frame" id="canvasFrame">
          <canvas id="gameCanvas" width="820" height="540"></canvas>
          <div id="floatingToast" class="floating-toast hidden">🐤✨</div>
        </div>
      </section>
    </main>

    <!-- Pure Visual Win Celebration Modal (Zero Text) -->
    <div id="winModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card win-card-visual">
        <div class="win-sparkles-row">🫧 👑 🛁 👑 🫧</div>
        <div class="win-avatar-giant">
          <img id="winCritterImg" src="icons/dogday.jpg" alt="" />
          <span class="win-happy-badge">🥰</span>
        </div>
        <div class="win-ducks-row" id="winDucksDisplay">
          <div class="win-duck-big earned">🐤</div>
          <div class="win-duck-big earned">🐤</div>
          <div class="win-duck-big earned">🐤</div>
        </div>
        <div class="win-actions-row">
          <button id="btnWinReplay" class="kid-action-btn replay">🔄</button>
          <button id="btnWinNext" class="kid-action-btn next">▶️</button>
        </div>
      </div>
    </div>

    <!-- Pure Visual All-8 Critters Finale Modal (Zero Text) -->
    <div id="finaleModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card finale-card-visual">
        <div class="win-sparkles-row">🌈 👑 🛁 🐤 🛁 👑 🌈</div>
        <div id="finaleCrittersGrid" class="finale-critters-grid"></div>
        <div class="win-actions-row">
          <button id="btnFinaleClose" class="kid-action-btn next">🎉</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
